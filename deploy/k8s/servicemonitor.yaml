apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mlx-servicemonitor
  namespace: mlx
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mlx-service
  endpoints:
    - port: proxy-http
      path: /metrics
      interval: 10s
    - port: hw-metrics
      path: /metrics
      interval: 10s
