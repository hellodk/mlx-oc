apiVersion: v1
kind: Service
metadata:
  name: mlx-service
  namespace: mlx
  labels:
    app.kubernetes.io/name: mlx-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mlx-workload
  ports:
    - name: proxy-http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: engine-api
      port: 8030
      targetPort: 8030
      protocol: TCP
    - name: hw-metrics
      port: 9102
      targetPort: 9102
      protocol: TCP
