# vmagent scrape configuration for mlx monitoring bundle edge node.
#
# Template variables substituted at deploy time:
#   CENTRAL_VICTORIA_METRICS -> host:port of central VictoriaMetrics
#   OTLP_SCHEME              -> http | https
#   MACBOOK_ID               -> node identifier from config/nodes.yml
#   MACBOOK_SERIAL           -> hardware serial from config/nodes.yml
#   VMAGENT_SCRAPE_INTERVAL  -> scrape interval (default 10s)
#   VMAGENT_MAX_SHARDS       -> remote_write queue max shards
#   VMAGENT_QUEUE_CAPACITY   -> remote_write queue capacity
#   VMAGENT_PERSISTENT_QUEUE -> persistent queue path (empty = in-memory only)
#
# Note: remote_write is configured via vmagent CLI flags (-remoteWrite.url)
# to ensure proper queue configuration. See mlx_monitoring_bundle.py start_vmagent().

global:
  scrape_interval: ${VMAGENT_SCRAPE_INTERVAL:-10s}
  external_labels:
    macbook: ${MACBOOK_ID:-unknown}
    serial: ${MACBOOK_SERIAL:-unknown}

scrape_configs:
  - job_name: mlx-proxy
    metrics_path: /metrics
    static_configs:
      - targets: ["${PROXY_LISTEN:-127.0.0.1:8080}"]
    relabel_configs:
      - target_label: service
        replacement: mlx-proxy
      - target_label: instance
        replacement: ${MACBOOK_ID:-unknown}:8080

  - job_name: mlx-hw
    metrics_path: /metrics
    static_configs:
      - targets: ["${HW_LISTEN:-127.0.0.1:9102}"]
    relabel_configs:
      - target_label: service
        replacement: mlx-hw
      - target_label: instance
        replacement: ${MACBOOK_ID:-unknown}:9102

  - job_name: mlx-kv
    metrics_path: /metrics
    static_configs:
      - targets: ["${KV_LISTEN:-127.0.0.1:9104}"]
    relabel_configs:
      - target_label: service
        replacement: mlx-kv
      - target_label: instance
        replacement: ${MACBOOK_ID:-unknown}:9104

  - job_name: mlx-supervisor
    metrics_path: /metrics
    static_configs:
      - targets: ["${SUPERVISOR_LISTEN:-127.0.0.1:9105}"]
    relabel_configs:
      - target_label: service
        replacement: mlx-supervisor
      - target_label: instance
        replacement: ${MACBOOK_ID:-unknown}:9105

  - job_name: mlx-logtailer
    metrics_path: /metrics
    static_configs:
      - targets: ["${LOGTAILER_LISTEN:-127.0.0.1:9106}"]
    relabel_configs:
      - target_label: service
        replacement: mlx-logtailer
      - target_label: instance
        replacement: ${MACBOOK_ID:-unknown}:9106
