# OpenTelemetry Collector config for the central observability stack.
#
# Pipelines:
#   logs    -> JSONL file (durable) + debug stdout
#   traces  -> debug stdout (edge proxies send traces directly to Opik)
#
# Metrics are intentionally NOT accepted here. All mlx_* metrics are scraped
# by the edge vmagent and pushed straight to VictoriaMetrics with
# remote_write. Keeping a second OTLP metrics path would create duplicate
# series with different labels.
#
# The collector runs inside the compose network, so the file exporter path is
# a named volume and no host substitution is required.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 128
    timeout: 5s

exporters:
  debug:
    verbosity: basic
    sampling_initial: 2
    sampling_thereafter: 0
  file:
    path: /var/log/otelcol/mlx-server-logs.jsonl
    rotation:
      max_megabytes: 50
      max_backups: 5

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file, debug]
