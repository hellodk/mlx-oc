# OpenTelemetry Collector config for the central observability stack.
#
# Template variables substituted at deploy time:
#   ${CENTRAL_VICTORIA_METRICS} -> host:port of central VictoriaMetrics
#   ${OTLP_SCHEME}              -> http | https
#
# Pipelines:
#   metrics  -> VictoriaMetrics via Prometheus remote_write
#   logs     -> JSONL file (durable) + debug stdout
#   traces   -> debug stdout (edge proxies send traces directly to Opik)
#
# Metrics are scrape-only from vmagent; OTLP metrics are NOT accepted here
# to avoid duplicate mlx_* series in VictoriaMetrics.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 128
    timeout: 5s

exporters:
  prometheus_remote_write:
    endpoint: ${OTLP_SCHEME:-http}://${CENTRAL_VICTORIA_METRICS:-192.168.1.100:8428}/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: basic
    sampling_initial: 2
    sampling_thereafter: 0
  file:
    path: /var/log/otelcol/mlx-server-logs.jsonl
    rotation:
      max_megabytes: 50
      max_backups: 5

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus_remote_write, debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file, debug]
