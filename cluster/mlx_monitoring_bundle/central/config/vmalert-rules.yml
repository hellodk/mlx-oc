# vmalert alert rules for the mlx monitoring bundle.
#
# One rule group per concern, grouped by macbook so alerts from different
# Devices never collapse into a single firing alert. All alerts carry the
# labels: macbook, node, serial, model (where available).
#
# Applied by vmalert (central stack). vmalert notifies Alertmanager via
# -notifier.url http://alertmanager:9093/api/v1/alerts.
#
# Silence windows and severity can be tuned per-deployment by editing
# this file - no container rebuild required.

groups:
  - name: mlx.device.down
    rules:
    # A Device is considered silent when no telemetry has been received for >3m.
    - alert: MLXDeviceSilent
      # Evaluates per-device: fires when a device that previously reported has sent no telemetry for > 3m.
      expr: time() - max_over_time(timestamp(up{job="mlx-hw"})[7d]) > 180
      for: 2m
      labels:
        severity: critical
        category: connectivity
      annotations:
        summary: "Device {{ $labels.device }} silent"
        description: |
          No telemetry received from Device {{ $labels.device }} (target {{ $labels.instance }},
          serial {{ $labels.serial }}) for >3 minutes. Check network connectivity,
          the vmagent sidecar, or whether the device is powered off.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#device-silent"

    - alert: MLXMacbookSilent
      # Backwards-compatible alias for legacy monitoring scrapers.
      expr: time() - max_over_time(timestamp(up{job="mlx-hw"})[7d]) > 180
      for: 2m
      labels:
        severity: critical
        category: connectivity
      annotations:
        summary: "Device {{ $labels.device }} silent (legacy alias)"
        description: "Backwards-compatible alias for MLXDeviceSilent"
        runbook: "https://docs.example.com/mlx-monitoring/runbook#device-silent"

    - alert: MLXClusterSilent
      # Fires when no hardware scrape target is reporting at all across the cluster.
      expr: absent(up{job="mlx-hw"}) == 1
      for: 5m
      labels:
        severity: critical
        category: connectivity
      annotations:
        summary: "All Devices silent / no telemetry reporting"
        description: "No hardware telemetry is reporting from any Device to central VictoriaMetrics."
        runbook: "https://docs.example.com/mlx-monitoring/runbook#macbook-silent"

  - name: mlx.hardware
    rules:
    - alert: MLXHardwareExporterDown
      # `up` is emitted per scrape target by vmagent, so this is per-node
      # and does not require hard-coding node names.
      expr: up{job="mlx-hw"} == 0
      for: 2m
      labels:
        severity: warning
        category: exporter
      annotations:
        summary: "HW exporter down on {{ $labels.device }} ({{ $labels.instance }})"
        description: |
          vmagent cannot scrape the hardware exporter for Device
          {{ $labels.device }} (target {{ $labels.instance }}, serial
          {{ $labels.serial }}). The mlx_hw_telemetry process may have crashed
          or is not listening on :9102.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#hw-exporter-down"

    - alert: MLXGPUHighUtilization
      expr: mlx_hw_gpu_utilization_percent > 95
      for: 10m
      labels:
        severity: warning
        category: hardware
      annotations:
        summary: "GPU saturated on {{ $labels.device }}: {{ $value }}%"
        description: |
          GPU active residency has been above 95% for 10 minutes on Device
          {{ $labels.device }} ({{ $labels.macbook }}). Inference throughput may
          be throttled; check mlx_hw_gpu_power_milliwatts and thermal pressure.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#gpu-saturated"

    - alert: MLXThermalThrottling
      expr: mlx_hw_thermal_pressure > 0.7
      for: 5m
      labels:
        severity: warning
        category: hardware
      annotations:
        summary: "Thermal throttling on {{ $labels.device }}: {{ $value }} pressure"
        description: |
          CPU scheduler limit is below 30% (thermal pressure > 0.7) on Device
          {{ $labels.device }} ({{ $labels.macbook }}). The chip is thermally
          throttling; expect lower inference throughput. Check ambient temp
          and airflow.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#thermal-throttling"

    - alert: MLXLoadHigh
      expr: mlx_hw_load15 > (mlx_hw_cpu_count * 0.9)
      for: 10m
      labels:
        severity: warning
        category: hardware
      annotations:
        summary: "High load on {{ $labels.device }}: {{ $value }} load15"
        description: |
          15-minute load average ({{ $value }}) exceeds 90% of logical CPU
          count on Device {{ $labels.device }} ({{ $labels.macbook }}). Host may
          be oversubscribed.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#high-load"

    - alert: MLXMemoryPressureHigh
      # mlx_hw_mem_available_bytes is computed by the exporter using the
      # runtime page size (16384 on Apple Silicon), so this rule has no
      # hard-coded page-size assumption.
      expr: mlx_hw_mem_available_bytes / mlx_hw_mem_total_bytes < 0.02
      for: 10m
      labels:
        severity: warning
        category: hardware
      annotations:
        summary: "Memory pressure on {{ $labels.device }}: <2% available RAM"
        description: |
          Available memory (free + inactive + speculative) is below 2% of
          physical RAM on Device {{ $labels.device }} ({{ $labels.macbook }}).
          The node is at risk of memory pressure killing the mlx_lm.server
          process.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#memory-pressure"

    - alert: MLXDiskFull
      expr: ((mlx_hw_disk_used_bytes / mlx_hw_disk_total_bytes) * 100) > 85
      for: 15m
      labels:
        severity: warning
        category: hardware
      annotations:
        summary: "Disk full on {{ $labels.device }}: {{ $value }}% used"
        description: |
          Root volume is over 85% full on Device {{ $labels.device }}
          ({{ $labels.macbook }}). The model cache lives on the boot volume; a
          full disk will break downloads and KV cache.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#disk-full"

  - name: mlx.serving
    rules:
    - alert: MLXServerDown
      expr: mlx_server_up == 0
      for: 3m
      labels:
        severity: critical
        category: serving
      annotations:
        summary: "mlx_lm.server down on {{ $labels.device }}"
        description: |
          mlx_server_up is 0 on Device {{ $labels.device }} (serial
          {{ $labels.serial }}). Check the external supervisor
          (launchd/systemd), mlx_server_state, and mlx_server_last_exit_code
          on :9105/metrics.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#server-down"

    - alert: MLXServerNotReady
      expr: mlx_server_ready == 0 and mlx_server_up == 1
      for: 5m
      labels:
        severity: warning
        category: serving
      annotations:
        summary: "mlx_lm.server not serving on {{ $labels.device }}"
        description: |
          Process is alive but /v1/models is not returning 200 on Device
          {{ $labels.device }} ({{ $labels.macbook }}). The model may still be
          loading or the server may be hung.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#server-not-ready"

    - alert: MLXModelNotLoaded
      expr: mlx_model_loaded == 0 and ignoring(model) mlx_server_ready == 1
      for: 10m
      labels:
        severity: warning
        category: serving
      annotations:
        summary: "Model not loaded on {{ $labels.device }}"
        description: |
          Server is ready but mlx_model_loaded is 0 for model {{ $labels.model }}
          on Device {{ $labels.device }}. The health probe never observed the
          model being served.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#model-not-loaded"

    - alert: MLXServerCrashLooping
      expr: increase(mlx_server_restarts_total[15m]) >= 3
      labels:
        severity: critical
        category: serving
      annotations:
        summary: "mlx_lm.server crash-looping on {{ $labels.device }}"
        description: |
          mlx_lm.server restarted {{ $value }} times in 15 minutes on Device
          {{ $labels.device }} ({{ $labels.macbook }}). Query
          mlx_server_last_crash_reason{device="{{ $labels.device }}"} == 1
          and check server.log for the crash reason.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#crash-looping"

    - alert: MLXSupervisorExporterDown
      expr: up{job="mlx-supervisor"} == 0
      for: 2m
      labels:
        severity: warning
        category: serving
      annotations:
        summary: "Passive server observer down on {{ $labels.device }}"
        description: |
          vmagent cannot scrape mlx_server_supervisor (:9105) on Device
          {{ $labels.device }} ({{ $labels.macbook }}). Server up/ready and
          crash-loop alerts may be stale until the exporter recovers.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#supervisor-down"

    - alert: MLXKVCacheExporterDown
      expr: up{job="mlx-kv"} == 0
      for: 2m
      labels:
        severity: warning
        category: serving
      annotations:
        summary: "KV-cache exporter down on {{ $labels.device }}"
        description: |
          vmagent cannot scrape mlx_kv_cache_agent (:9104) on Device
          {{ $labels.device }} ({{ $labels.macbook }}). KV cache metrics are stale.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#kv-exporter-down"

    - alert: MLXLogTailerDown
      expr: up{job="mlx-logtailer"} == 0
      for: 2m
      labels:
        severity: warning
        category: serving
      annotations:
        summary: "Server log tailer down on {{ $labels.device }}"
        description: |
          vmagent cannot scrape mlx_server_log_tailer (:9106) on Device
          {{ $labels.device }} ({{ $labels.macbook }}). OTLP log shipping is halted.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#logtailer-down"

    - alert: MLXProcessExporterDown
      expr: up{job="mlx-process"} == 0
      for: 2m
      labels:
        severity: warning
        category: host
      annotations:
        summary: "Process profiler down on {{ $labels.device }}"
        description: |
          vmagent cannot scrape mlx_process_telemetry (:9107) on Device
          {{ $labels.device }} ({{ $labels.macbook }}).
        runbook: "https://docs.example.com/mlx-monitoring/runbook#process-exporter-down"

    - alert: MLXSBOMExporterDown
      expr: up{job="mlx-sbom"} == 0
      for: 5m
      labels:
        severity: warning
        category: host
      annotations:
        summary: "SBOM collector down on {{ $labels.device }}"
        description: |
          vmagent cannot scrape mlx_sbom_collector (:9108) on Device
          {{ $labels.device }} ({{ $labels.macbook }}).
        runbook: "https://docs.example.com/mlx-monitoring/runbook#sbom-exporter-down"

  - name: mlx.inference
    rules:
    - alert: MLXProxyDown
      expr: up{job="mlx-proxy"} == 0
      for: 2m
      labels:
        severity: critical
        category: inference
      annotations:
        summary: "Proxy down on {{ $labels.device }}"
        description: |
          vmagent cannot scrape mlx_metrics_proxy on Device {{ $labels.device }} ({{ $labels.macbook }}).
          The proxy is not listening on :8080; clients cannot reach the server.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#proxy-down"

    - alert: MLXUpstreamDown
      expr: mlx_up == 0 and up{job="mlx-proxy"} == 1
      for: 3m
      labels:
        severity: critical
        category: inference
      annotations:
        summary: "Upstream mlx_lm.server unreachable via proxy on {{ $labels.device }}"
        description: |
          The proxy (:8080) cannot reach the upstream mlx_lm.server on {{ $labels.device }}.
          Check that mlx_lm.server is listening and healthy.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#upstream-down"

    - alert: MLXThroughputDrop
      expr: (sum by (device, macbook) (rate(mlx_requests_total[5m])) < 0.1) and (sum by (device, macbook) (rate(mlx_requests_total[1h])) > 0)
      for: 15m
      labels:
        severity: warning
        category: inference
      annotations:
        summary: "Throughput drop on {{ $labels.device }}: {{ $value }} req/s"
        description: |
          Request rate has fallen below 0.1 req/s for 15 minutes on Device
          {{ $labels.device }} ({{ $labels.macbook }}). Either idle (expected
          overnight) or the serving path is degraded. Correlate with
          MLXServerDown / MLXProxyDown.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#throughput-drop"

    - alert: MLXTTFTHigh
      expr: histogram_quantile(0.95, rate(mlx_ttft_seconds_bucket[5m])) > 5
      for: 10m
      labels:
        severity: warning
        category: inference
      annotations:
        summary: "High TTFT on {{ $labels.device }}: p95 {{ $value }}s"
        description: |
          95th-percentime time-to-first-token exceeds 5s on Device
          {{ $labels.device }} ({{ $labels.macbook }}). Check GPU utilization,
          memory pressure, and whether the model is evicted from cache.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#ttft-high"

    - alert: MLXGenerationSlow
      expr: histogram_quantile(0.95, rate(mlx_generation_seconds_bucket[5m])) > 60
      for: 10m
      labels:
        severity: warning
        category: inference
      annotations:
        summary: "Slow generation on {{ $labels.device }}: p95 {{ $value }}s"
        description: |
          95th-percentime generation time exceeds 60s on Device
          {{ $labels.device }} ({{ $labels.macbook }}). Likely GPU/thermal throttling
          or KV cache pressure.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#generation-slow"

    - alert: MLXTokenRateLow
      expr: histogram_quantile(0.5, rate(mlx_token_rate_tokens_per_second_bucket[5m])) < 5
      for: 10m
      labels:
        severity: warning
        category: inference
      annotations:
        summary: "Low token rate on {{ $labels.device }}: {{ $value }} tok/s"
        description: |
          Median token rate below 5 tok/s on Device {{ $labels.device }}
          ({{ $labels.macbook }}). Consistent with thermal throttling or a
          memory-bandwidth-bound generation.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#token-rate-low"

  - name: mlx.quality
    rules:
    - alert: MLXHallucinationHigh
      expr: mlx_hallucination_risk > 0.7
      for: 5m
      labels:
        severity: warning
        category: quality
      annotations:
        summary: "High hallucination risk on {{ $labels.device }}: {{ $value }}"
        description: |
          Composite hallucination risk (repetition + refusal + hedging +
          ungrounded) is above 0.7 on Device {{ $labels.device }}
          ({{ $labels.macbook }}). Review recent completions for fabricated output.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#hallucination-high"

    - alert: MLXLowConfidence
      expr: mlx_token_confidence_mean < 0.5
      for: 10m
      labels:
        severity: warning
        category: quality
      annotations:
        summary: "Low token confidence on {{ $labels.device }}: {{ $value }}"
        description: |
          Mean per-token confidence is below 0.5 on Device {{ $labels.device }}
          ({{ $labels.macbook }}). The model is guessing on sampled tokens; check
          temperature and whether logprobs scoring coverage is adequate.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#low-confidence"

    - alert: MLXHighPerplexity
      expr: mlx_output_perplexity > 3
      for: 10m
      labels:
        severity: warning
        category: quality
      annotations:
        summary: "High perplexity on {{ $labels.device }}: {{ $value }}"
        description: |
          Output perplexity exceeds 3 on Device {{ $labels.device }}
          ({{ $labels.macbook }}). The model distribution is flat - it is sampling
          from uncertain tokens more often than not.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#high-perplexity"

    - alert: MLXLowConfidenceRatioHigh
      expr: mlx_low_confidence_token_ratio > 0.3
      for: 10m
      labels:
        severity: warning
        category: quality
      annotations:
        summary: "High low-confidence token ratio on {{ $labels.device }}: {{ $value }}"
        description: |
          Over 30% of scored tokens fall below the low-confidence threshold on
          Device {{ $labels.device }} ({{ $labels.macbook }}).
        runbook: "https://docs.example.com/mlx-monitoring/runbook#low-confidence-ratio"

  - name: mlx.kv
    rules:
    - alert: MLXKVCacheFull
      expr: mlx_kv_cache_utilization > 0.85
      for: 10m
      labels:
        severity: warning
        category: kv_cache
      annotations:
        summary: "KV cache near capacity on {{ $labels.device }}: {{ $value }}"
        description: |
          KV cache utilization is above 85% on Device {{ $labels.device }}
          ({{ $labels.macbook }}). Expect prompt cache evictions and rising TTFT.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#kv-cache-full"

  - name: mlx.slo
    rules:
    - alert: MLXErrorBudget
      expr: |
        (sum by (device) (rate(mlx_error_total{status=~"5.."}[1h])) /
         (sum by (device) (rate(mlx_requests_total[1h])) > 0)) > 0.05
      for: 1h
      labels:
        severity: warning
        category: slo
      annotations:
        summary: "Error budget exceeded on {{ $labels.device }}: {{ $value }} error rate"
        description: |
          5xx error rate over the last hour exceeds 5% on Device
          {{ $labels.device }} ({{ $labels.macbook }}). Investigate upstream
          failures, proxy rejections, and OOMs.
        runbook: "https://docs.example.com/mlx-monitoring/runbook#error-budget"
