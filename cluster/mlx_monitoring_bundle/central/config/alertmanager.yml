# Alertmanager configuration for central observability stack.
# vmalert sends fired alerts here via -notifier.url.
#
# Routing:
#   critical -> oncall webhook
#   everything -> default webhook
#
# Inhibit rules suppress cascade alerts when a node/proxy is down.
# group_by includes macbook so alerts from different Macbooks don't collapse.

global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "macbook", "model"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - matchers:
        - severity = critical
      receiver: "oncall"

receivers:
  - name: "oncall"
    # Webhook receiver for critical alerts.
    # To enable, set ONCALL_WEBHOOK_URL or ALERT_WEBHOOK_URL in environment
    # using LAN IP, FQDN, or compose service name (e.g. http://192.168.1.50:9000/hooks/oncall).
    # Default is no-op so Alertmanager runs cleanly under both Docker and Podman.
    webhook_configs: []

  - name: "default"
    # Default receiver for warning/info alerts.
    # To enable, set ALERT_WEBHOOK_URL in environment.
    webhook_configs: []

inhibit_rules:
  - source_matchers:
      - alertname = "MLXProxyDown"
    target_matchers:
      - alertname =~ "MLXUpstreamDown|MLXThroughputDrop|MLXInferenceStalled"
    equal: ["macbook"]

  - source_matchers:
      - alertname =~ "MLXHardwareExporterDown"
    target_matchers:
      - alertname =~ "MLXGPUHighUtilization|MLXThermalThrottling|MLXLoadHigh"
    equal: ["macbook"]

  - source_matchers:
      - alertname = "MLXMacbookSilent"
    target_matchers:
      - alertname =~ "MLX.*"
    equal: ["macbook"]
