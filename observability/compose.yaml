services:
  victoria-metrics:
    image: docker.io/victoriametrics/victoria-metrics:latest
    container_name: victoria-metrics
    restart: unless-stopped
    ports:
      - "8428:8428"        # Prometheus-compatible API + /vmui query UI
    command:
      - -promscrape.config=/etc/vm-scrape.yml
      - -retentionPeriod=30d
      - -storageDataPath=/victoria-metrics-data
    environment:
      - MLX_IP=${MLX_IP:-192.168.1.64}
    volumes:
      - vm-data:/victoria-metrics-data
      - ./vm-scrape.yml:/etc/vm-scrape.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8428/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional: OTLP gateway so the MLX proxy / hw agents can push
  # traces, metrics and logs (--otlp-endpoint http://192.168.1.64:4318).
  # Metrics are remote-written into VictoriaMetrics; logs are appended to a
  # JSONL file in the mlx-logs volume; traces go to stdout.
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    # The file-exporter volume is root-owned inside the podman VM; run as root
    # so the logs pipeline can append its JSONL file (ephemeral stack).
    user: "0"
    ports:
      - "4317:4317"        # OTLP gRPC
      - "4318:4318"        # OTLP HTTP
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol-config.yaml:/etc/otelcol/config.yaml:ro
      - mlx-logs:/var/log/otelcol

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_DEFAULT_THEME=light
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Alerting: vmalert evaluates the rule groups against VictoriaMetrics and
  # forwards fired alerts to Alertmanager. Active alerts are written back to
  # VM (`ALERTS` series) so Grafana can annotate them.
  vmalert:
    image: docker.io/victoriametrics/vmalert:latest
    container_name: vmalert
    restart: unless-stopped
    ports:
      - "8880:8880"        # vmalert UI: /api/v1/alerts, /api/v1/rules
    command:
      - -datasource.url=http://victoria-metrics:8428
      - -remoteWrite.url=http://victoria-metrics:8428
      - -notifier.url=http://alertmanager:9093
      - -rule=/etc/vmalert/rules.yml
      - -httpListenAddr=:8880
    volumes:
      - ./vmalert/rules.yml:/etc/vmalert/rules.yml:ro
    depends_on:
      - victoria-metrics
      - alertmanager

  alertmanager:
    image: docker.io/prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"        # Alertmanager UI / webhook config
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

volumes:
  vm-data:
  grafana-data:
  mlx-logs:
