# OpenTelemetry Collector config for the temporary podman observability stack.
# Receives OTLP from the MLX proxy / hw agents and:
#   - metrics -> VictoriaMetrics via Prometheus remote write
#   - logs    -> JSONL file (durable, mounted from compose) + debug (stdout)
#   - traces  -> debug (stdout); per-request LLM traces also go to Opik directly
#                from the proxy (OPIK_OTLP_ENDPOINT), Opik has no OTLP logs
#                ingestion so logs stop here.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 128
    timeout: 5s

exporters:
  prometheus_remote_write:
    endpoint: http://victoria-metrics:8428/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: basic
    sampling_initial: 2
    sampling_thereafter: 0
  file:
    path: /var/log/otelcol/mlx-server-logs.jsonl
    rotation:
      max_megabytes: 50
      max_backups: 5

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus_remote_write, debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file, debug]
