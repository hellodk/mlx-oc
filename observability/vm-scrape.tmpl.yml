# VictoriaMetrics single-node scrape config.
# Generated from vm-scrape.tmpl.yml by ./setup.sh (substitutes __MLX_IP__ /
# __RANK1_IP__ with your Mac addresses). The podman stack runs on this node
# (192.168.1.64, rank0 = vLLM/vllm-metal + vllm session proxy on the ring).
#
# vLLM topology (since 2026-08-13):
#   - session proxy  192.168.1.64:8080/metrics   (vllm_session_proxy_*)
#   - vllm rank0     192.168.1.64:8081/metrics   (native vllm:* metrics, 8 GiB)
#   - vllm peer      192.168.2.2:8081/metrics    (native vllm:* metrics, 16 GiB)
#
# Legacy MLX targets (stack currently stopped; kept so the config is valid if
# the MLX cluster is redeployed):
#   - proxy      <MLX_IP>:8080/metrics   (inference + hallucination metrics)
#   - hw agents  <MLX_IP>:9102 (rank0) and <RANK1_IP>:9102 (rank1)
#   - kv agent   <MLX_IP>:9104           (KV cache + context-length gauges)
global:
  scrape_interval: 10s

scrape_configs:
  # vllm_session_proxy.py on rank0: per-session routing, per-backend request
  # counters. Source of truth for "which session went to which node".
  - job_name: vllm-proxy
    metrics_path: /metrics
    static_configs:
      - targets: ["192.168.1.64:8080"]
        labels:
          service: vllm-proxy
          node: rank0

  # Native vllm:* Prometheus metrics from each vllm-metal serving node.
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["192.168.1.64:8081"]
        labels:
          service: vllm
          node: rank0
      - targets: ["192.168.2.2:8081"]
        labels:
          service: vllm
          node: peer
  - job_name: mlx-proxy
    metrics_path: /metrics
    static_configs:
      - targets: ["__MLX_IP__:8080"]
        labels:
          service: mlx-proxy
          node: rank0

  - job_name: mlx-hw
    metrics_path: /metrics
    static_configs:
      - targets:
          - "__MLX_IP__:9102"
        labels:
          service: mlx-hw
          node: rank0
      - targets:
          - "__RANK1_IP__:9102"
        labels:
          service: mlx-hw
          node: rank1

  - job_name: mlx-kv
    metrics_path: /metrics
    static_configs:
      - targets: ["__MLX_IP__:9104"]
        labels:
          service: mlx-kv
          node: rank0

  # mlx_server_supervisor.py on rank 0: process/ready/model-serving status plus
  # restart + crash-reason counters. This is the source of truth for "is the
  # model actually loaded and serving right now?".
  - job_name: mlx-supervisor
    metrics_path: /metrics
    static_configs:
      - targets: ["__MLX_IP__:9105"]
        labels:
          service: mlx-supervisor
          node: rank0

  # mlx_server_log_tailer.py on rank 0: server.log -> Opik log streaming
  # health (up / shipped / dropped / rate-limited). Source of truth for whether
  # log lines are actually reaching Opik.
  - job_name: mlx-logtailer
    metrics_path: /metrics
    static_configs:
      - targets: ["__MLX_IP__:9106"]
        labels:
          service: mlx-logtailer
          node: rank0

  # Experimental / unverified: two independent sglang replicas (no ring/TP
  # backend on Apple Silicon). Native sglang:* Prometheus metrics, no proxy
  # sidecar needed. See sglang/ and README.md "SGLang (experimental)".
  - job_name: sglang
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "__MLX_IP__:30000"
        labels:
          service: sglang
          node: rank0
          provider: "sglang"
      - targets:
          - "__RANK1_IP__:30000"
        labels:
          service: sglang
          node: rank1
          provider: "sglang"
