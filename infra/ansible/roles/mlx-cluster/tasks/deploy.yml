---
# Bring the stack up from the manifest cluster/mlx-stack.json (rendered by the
# setup tasks). Every node starts only its own components
# (component.host == inventory_hostname) and waits for each component's health
# endpoint before moving on. The ring itself is the "server" component on rank0
# (supervisor -> mlx.launch shards to the peers over the hostfile).
#
# The final rank0-only waits prove the whole path: mlx_lm.server on :8081 and
# the OpenAI proxy on :8080/v1/models.

- name: "read the stack manifest"
  slurp:
    src: "{{ mlx_repo_dir }}/cluster/mlx-stack.json"
  register: mlx_manifest_raw
  tags: [start]

- name: "decode the stack manifest"
  set_fact:
    mlx_manifest: "{{ mlx_manifest_raw.content | b64decode | from_json }}"
  tags: [start]

- name: "ensure the logs dir exists on this node"
  file:
    path: "{{ mlx_manifest.logs_dir }}"
    state: directory
  tags: [start]

- name: "start this node's components from the manifest"
  include_tasks: start_one.yml
  loop: "{{ mlx_manifest.components | selectattr('host', 'equalto', inventory_hostname) | list }}"
  loop_control:
    loop_var: mlx_comp
  tags: [start]

- name: "wait for mlx_lm.server on rank0"
  uri:
    url: "http://{{ mlx_cluster.server_bind_ip }}:{{ mlx_cluster.ports.server }}/v1/models"
    status_code: 200
  register: mlx_ready
  until: mlx_ready.status == 200
  retries: 180
  delay: 2
  when: inventory_hostname == mlx_rank0_host
  tags: [start]

- name: "verify the OpenAI proxy is serving"
  uri:
    url: "http://{{ mlx_cluster.server_bind_ip }}:{{ mlx_cluster.ports.proxy }}/v1/models"
    status_code: 200
  register: mlx_proxy_ready
  until: mlx_proxy_ready.status == 200
  retries: 30
  delay: 2
  when: inventory_hostname == mlx_rank0_host
  tags: [start]

- name: "report the serving endpoint"
  debug:
    msg: >-
      MLX cluster is UP ({{ mlx_cluster.nodes | length }} nodes).
      curl -s http://{{ mlx_cluster.server_bind_ip }}:{{ mlx_cluster.ports.proxy }}/v1/models
      | model: {{ mlx_cluster.model }}
      | ring: {{ mlx_cluster.interconnect }} / {{ mlx_cluster.ring_backend }}
  when: inventory_hostname == mlx_rank0_host
  tags: [start]
