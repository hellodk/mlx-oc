---
# =============================================================================
# MLX cluster configuration — generated by tools/mlx-deploy.py
# =============================================================================
# Do not hand-edit while using the wizard; re-run it instead. See
# infra/ansible/group_vars/all/README for the hand-edited workflow.
mlx_cluster:
  nodes:
    -
      name: rank0
      ssh: "127.0.0.1"
      ring_ip: "192.168.2.1"
      local: true
    -
      name: rank1
      ssh: dk@192.168.2.2
      ring_ip: "192.168.2.2"
      local: false
  ring_backend: ring
  interconnect: ethernet
  ring_subnet: "192.168.2"
  server_bind_ip: "127.0.0.1"
  model: mlx-community/Qwen3.5-4B-MLX-4bit
  model_name: Qwen3.5-4B-MLX-4bit
  model_dir: /Users/dk/mlx-models
  download_model: true
  model_sync_from_rank0: true
  min_ram_mb: 8192
  min_disk_gb: 15
  python_server: python3.12
  python_proxy: python3.12
  venv_server: ~/venvs/mlx
  repo_dir: /Users/dk/mlx-oc
  sync_repo: true
  install_method: online
  wheelhouse: ""
  install_opik: false
  ports:
    server: 8081
    proxy: 8080
    supervisor: 9105
    hw: 9102
    kv: 9104
    logtailer: 9106
  default_temp: 0.0
  logprobs: 3
  logprobs_stream_sample: 0.05
  low_confidence: 0.5
  api_key: ""
  max_prompt_tokens: 16000
  max_tokens_cap: 4096
  max_body_bytes: 4194304
  rate_limit: 0
  otlp_endpoint: ""
  opik_otlp_endpoint: ""
  opik_base: ""
  judge_url: http://127.0.0.1:8080/v1
  pins:
    mlx: "0.32.0"
    mlx_lm: "0.31.3"
    mlx_metal: "0.32.0"
    huggingface_hub: "1.26.0"
    prometheus_client: "0.26.0"
    opentelemetry: "1.44.0"
    otel_contrib: "0.65b0"
mlx_rank0_host: "{{ mlx_cluster.nodes[0].name }}"
